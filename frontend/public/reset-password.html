<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - READhub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
</head>
<body>
    <div class="auth-container">
        <!-- Theme Toggle -->
        <div class="theme-toggle-host" style="position:absolute; top:2rem; right:2rem; z-index:100;"></div>

        <div class="auth-card glass">
            <div class="auth-header">
                <h2>Reset Password</h2>
                <p>Please enter your new password below.</p>
            </div>
            
            <div id="global-alert" class="alert"></div>

            <form id="reset-password-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" class="form-control" placeholder="Enter new password" required minlength="8">
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Confirm new password" required minlength="8">
                </div>
                
                <button type="submit" class="btn btn-primary">Reset Password</button>
            </form>
            
            <div class="switch-form" style="margin-top: 1.5rem;">
                <a href="/login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api';

        const showAlert = (message, type = 'error') => {
            const alertEl = document.getElementById('global-alert');
            if (!alertEl) return;
            alertEl.className = `alert alert-${type}`;
            alertEl.textContent = message;
            alertEl.style.display = 'block';
        };

        const hideAlert = () => {
             const alertEl = document.getElementById('global-alert');
             if (alertEl) alertEl.style.display = 'none';
        }

        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                showAlert('Invalid or missing reset token. Please request a new password reset link.');
                return;
            }

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match.');
                return;
            }

            if (newPassword.length < 8) {
                showAlert('Password must be at least 8 characters long.');
                return;
            }

            if (newPassword.length > 255) {
                showAlert('Password cannot be greater than 255 characters.');
                return;
            }
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = 'Resetting...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    showAlert(data.error || 'Failed to reset password.', 'error');
                    return;
                }
                
                showAlert(data.message, 'success');
                e.target.reset(); // clear form
                
                // Redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 3000);
                
            } catch (err) {
                 showAlert('Network error. Please try again later.');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
