<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - READhub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
</head>
<body>
    <div class="auth-container">
        <!-- Theme Toggle -->
        <div class="theme-toggle-host" style="position:absolute; top:2rem; right:2rem; z-index:100;"></div>

        <div class="auth-card glass">
            <div class="auth-header">
                <h2>Forgot Password</h2>
                <p>Enter your email to receive a reset link.</p>
            </div>
            
            <div id="global-alert" class="alert"></div>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    <div id="email-error" class="error-message"></div>
                </div>
                
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </form>
            
            <div class="switch-form" style="margin-top: 1.5rem;">
                Remembered your password? <a href="/login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api';

        const showAlert = (message, type = 'error') => {
            const alertEl = document.getElementById('global-alert');
            if (!alertEl) return;
            alertEl.className = `alert alert-${type}`;
            alertEl.textContent = message;
            alertEl.style.display = 'block';
        };

        const hideAlert = () => {
             const alertEl = document.getElementById('global-alert');
             if (alertEl) alertEl.style.display = 'none';
        }

        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showAlert('Please enter your email address.');
                return;
            }
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = 'Sending...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    showAlert(data.error || 'Failed to process request.', 'error');
                    return;
                }
                
                // Automatically redirect to the reset password page with the generated token
                window.location.href = `/reset-password.html?token=${data.token}`;
                
            } catch (err) {
                 showAlert('Network error. Please try again later.');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
