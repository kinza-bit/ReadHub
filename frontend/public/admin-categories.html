<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - READhub Admin</title>
    <meta name="description" content="Admin category management panel for READhub bookstore. Create, rename, and delete book categories.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
    <style>
        .brand span {
            color: #ef4444;
            font-size: 0.8rem;
            text-transform: uppercase;
            vertical-align: super;
            margin-left: 0.2rem;
        }
    </style>
</head>

<body class="protected-admin">
    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">READhub<span>Admin</span></div>
            <button class="sidebar-close" id="sidebar-close">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="/admin-dashboard.html" class="sidebar-link">📊 Dashboard</a>
            <a href="/admin-users.html" class="sidebar-link">👥 Manage Users</a>
            <a href="/admin-books.html" class="sidebar-link">📚 Manage Books</a>
            <a href="/admin-categories.html" class="sidebar-link" style="color: var(--primary)">🏷️ Categories</a>
        </nav>
    </aside>

    <nav class="navbar glass" style="border-bottom-color: rgba(239, 68, 68, 0.3);">
        <div style="display: flex; align-items: center;">
            <div class="hamburger-icon" id="hamburger-menu">
                <span></span><span></span><span></span>
            </div>
            <div class="brand">READhub<span>Admin</span></div>
        </div>
        <div class="nav-links">
            <span>Logged in as: <strong id="user-name-display" style="color: #ef4444;">Admin</strong></span>
            <div class="theme-toggle-host"></div>
            <button id="logout-btn" class="logoutButton">
                <span class="button-text">Log Out</span>
                <svg class="doorway" viewBox="0 0 16 16">
                    <path d="M3 14V1H13V14M13 8H15" stroke="currentColor" stroke-width="2" fill="none" />
                </svg>
                <svg class="door" viewBox="0 0 16 16">
                    <path d="M3 1H13V15H3V1Z" />
                    <circle cx="10" cy="8" r="1.2" fill="#fff" />
                </svg>
                <svg class="figure" viewBox="0 0 16 16">
                    <circle cx="8" cy="3" r="2.5" />
                    <path d="M8 6C5 6 4 8 4 11V15H12V11C12 8 11 6 8 6Z" />
                </svg>
            </button>
        </div>
    </nav>

    <main class="dashboard-container">
        <!-- Page Header -->
        <div class="admin-page-header">
            <div>
                <h2>🏷️ Category Management</h2>
                <p>Organize your bookstore with categories.</p>
            </div>
        </div>

        <!-- Add Category Form -->
        <div class="glass" style="padding: 1.75rem; border-radius: 1rem; margin-bottom: 2rem;">
            <h4 style="margin-bottom: 1rem; color: var(--color-text);">Add New Category</h4>
            <form id="add-category-form" class="inline-form-row">
                <input type="text" id="new-category-name" class="form-control" placeholder="Category name *" required>
                <input type="text" id="new-category-desc" class="form-control" placeholder="Description (optional)">
                <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">✚ Add</button>
            </form>
        </div>

        <!-- Categories Grid -->
        <div id="categories-container" class="category-grid">
            <!-- Categories loaded dynamically -->
            <div class="empty-state" style="grid-column: 1 / -1;">
                <div class="spinner"></div>
                <p style="margin-top: 1rem;">Loading categories...</p>
            </div>
        </div>
    </main>

    <!-- Edit Category Modal -->
    <div id="category-modal" class="modal">
        <div class="modal-content glass" style="max-width: 480px;">
            <div class="modal-header">
                <h3>Edit Category</h3>
                <button class="close-modal" id="close-category-modal">&times;</button>
            </div>
            <form id="edit-category-form">
                <input type="hidden" id="edit-category-id">
                <div class="form-group">
                    <label for="edit-category-name">Category Name *</label>
                    <input type="text" id="edit-category-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="edit-category-description">Description</label>
                    <textarea id="edit-category-description" class="form-control" rows="3" style="resize: vertical;"></textarea>
                </div>
                <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <button type="button" class="btn btn-secondary close-modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Dialog -->
    <div id="delete-confirm" class="confirm-dialog">
        <div class="confirm-dialog-content">
            <div class="confirm-dialog-icon">🗑️</div>
            <h3 class="confirm-dialog-title">Delete Category</h3>
            <p class="confirm-dialog-message" id="delete-confirm-message">
                Are you sure you want to delete this category?
            </p>
            <div class="confirm-dialog-actions">
                <button id="btn-confirm-delete" class="btn btn-danger" style="border-radius: 0.75rem;">Delete</button>
                <button id="btn-cancel-delete" class="btn btn-secondary" style="border-radius: 0.75rem;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/admin-categories.js"></script>
</body>

</html>
