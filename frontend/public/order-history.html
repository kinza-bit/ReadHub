<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - READhub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
</head>
<body class="protected-user">
    <nav class="navbar glass">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div class="hamburger-container">
                <button class="hamburger-btn" onclick="this.nextElementSibling.classList.toggle('show')">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="hamburger-menu glass">
                    <a href="/dashboard.html" class="dropdown-item">Dashboard</a>
                    <a href="/browse.html" class="dropdown-item">Browse Books</a>
                    <a href="/cart.html" class="dropdown-item">My Cart</a>
                    <a href="/order-history.html" class="dropdown-item">Order History</a>
                    <a href="/profile.html" class="dropdown-item">My Profile</a>
                </div>
            </div>
            <a href="/dashboard.html" class="brand" style="text-decoration: none;">READhub</a>
        </div>
        <div class="nav-links">
            <div class="theme-toggle-host"></div>
            <button id="logout-btn" class="logoutButton" style="display: flex;">
                <span class="button-text">Log Out</span>
                <svg class="doorway" viewBox="0 0 16 16"><path d="M3 14V1H13V14M13 8H15" stroke="currentColor" stroke-width="2" fill="none" /></svg>
                <svg class="door" viewBox="0 0 16 16"><path d="M3 1H13V15H3V1Z" /><circle cx="10" cy="8" r="1.2" fill="#fff" /></svg>
                <svg class="figure" viewBox="0 0 16 16"><circle cx="8" cy="3" r="2.5" /><path d="M8 6C5 6 4 8 4 11V15H12V11C12 8 11 6 8 6Z" /></svg>
            </button>
        </div>
    </nav>
    <main class="dashboard-container" style="max-width: 1100px;">
        <div class="rh-page-header">
            <h1>Order <span class="headline-gradient-text">History</span></h1>
            <p class="rh-page-subtitle">Track and review your past purchases</p>
        </div>
        <div id="orders-loading" class="rh-loading-state"><div class="rh-spinner"></div><p>Loading your orders...</p></div>
        <div id="orders-empty" class="rh-empty-cart" style="display: none;">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            <h3>No orders yet</h3>
            <p>Your purchase history will appear here once you place an order.</p>
            <a href="/browse.html" class="btn btn-primary" style="width: auto; margin-top: 1rem; text-decoration: none;">Start Shopping</a>
        </div>
        <div id="orders-list"></div>
    </main>
    <div class="rh-toast" id="toast-notification"><span id="toast-message"></span></div>
    <script src="/js/auth.js"></script>
    <script src="/js/order-history.js"></script>
</body>
</html>
