<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - READhub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
    <style>
        .brand span {
            color: #ef4444;
            font-size: 0.8rem;
            text-transform: uppercase;
            vertical-align: super;
            margin-left: 0.2rem;
        }
    </style>
</head>
<!-- The class protected-admin triggers the auth check in auth.js -->

<body class="protected-admin">
    <!-- Sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">READhub<span>Admin</span></div>
            <button class="sidebar-close" id="sidebar-close">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard.html" class="sidebar-link">Dashboard</a>
            <a href="/admin-dashboard.html" class="sidebar-link" style="color: var(--primary)">Admin Panel</a>
            <a href="/admin-users.html" class="sidebar-link">Manage Users</a>
            <a href="/login.html" class="sidebar-link">User Login</a>
        </nav>
    </aside>

    <nav class="navbar glass" style="border-bottom-color: rgba(239, 68, 68, 0.3);">
        <div style="display: flex; align-items: center;">
            <div class="hamburger-icon" id="hamburger-menu">
                <span></span><span></span><span></span>
            </div>
            <div class="brand">READhub<span>Admin</span></div>
        </div>
        <div class="nav-links">
            <span>Logged in as: <strong id="user-name-display" style="color: #ef4444;">Admin</strong></span>
            <div class="theme-toggle-host"></div>
            <button id="logout-btn" class="logoutButton">
                <span class="button-text">Log Out</span>
                <svg class="doorway" viewBox="0 0 16 16">
                    <path d="M3 14V1H13V14M13 8H15" stroke="currentColor" stroke-width="2" fill="none" />
                </svg>
                <svg class="door" viewBox="0 0 16 16">
                    <path d="M3 1H13V15H3V1Z" />
                    <circle cx="10" cy="8" r="1.2" fill="#fff" />
                </svg>
                <svg class="figure" viewBox="0 0 16 16">
                    <circle cx="8" cy="3" r="2.5" />
                    <path d="M8 6C5 6 4 8 4 11V15H12V11C12 8 11 6 8 6Z" />
                </svg>
            </button>
        </div>
    </nav>

    <main class="dashboard-container">

        <div style="margin-bottom: 2rem;">
            <h2>Platform Management Panel</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">System overview and administrative controls.</p>
        </div>

        <div class="overview-cards">
            <div class="stat-card glass" style="border-top: 3px solid var(--primary);">
                <h3>Total Users</h3>
                <div class="value">0</div>
            </div>
            <div class="stat-card glass" style="border-top: 3px solid var(--success);">
                <h3>Books in Catalog</h3>
                <div class="value">0</div>
            </div>
            <div class="stat-card glass" style="border-top: 3px solid var(--error);">
                <h3>Total Orders</h3>
                <div class="value">0</div>
            </div>
        </div>

        <div class="glass" style="margin-top: 3rem; padding: 2rem; border-radius: 1rem;">
            <h3>Quick Actions</h3>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <a href="/admin-users.html" class="btn btn-primary" style="text-decoration: none;">Manage Users</a>
                <button class="btn btn-primary">Manage Inventory</button>
                <button class="btn btn-primary">View Requests</button>
            </div>
        </div>

    </main>

    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger-menu');
            const closeBtn = document.getElementById('sidebar-close');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            function toggleSidebar() {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }

            if (hamburger) hamburger.addEventListener('click', toggleSidebar);
            if (closeBtn) closeBtn.addEventListener('click', toggleSidebar);
            if (overlay) overlay.addEventListener('click', toggleSidebar);
        });
    </script>
</body>

</html>
