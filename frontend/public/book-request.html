<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Book - READhub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
</head>
<body class="protected-user">
    <nav class="navbar glass">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div class="hamburger-container">
                <button class="hamburger-btn" onclick="this.nextElementSibling.classList.toggle('show')">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="hamburger-menu glass">
                    <a href="/dashboard.html" class="dropdown-item">Dashboard</a>
                    <a href="/browse.html" class="dropdown-item">Browse Books</a>
                    <a href="/profile.html" class="dropdown-item">My Profile</a>
                    <a href="/book-request.html" class="dropdown-item">Request a Book</a>
                </div>
            </div>
            <a href="/dashboard.html" class="brand" style="text-decoration: none;">READhub</a>
        </div>
        <div class="nav-links">
            <div class="notification-bell">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span class="indicator-dot"></span>
            </div>
            <div class="theme-toggle-host"></div>
            <button id="logout-btn" class="logoutButton">
                <span class="button-text">Log Out</span>
                <svg class="doorway" viewBox="0 0 16 16">
                    <path d="M3 14V1H13V14M13 8H15" stroke="currentColor" stroke-width="2" fill="none" />
                </svg>
                <svg class="door" viewBox="0 0 16 16">
                    <path d="M3 1H13V15H3V1Z" />
                    <circle cx="10" cy="8" r="1.2" fill="#fff" />
                </svg>
                <svg class="figure" viewBox="0 0 16 16">
                    <circle cx="8" cy="3" r="2.5" />
                    <path d="M8 6C5 6 4 8 4 11V15H12V11C12 8 11 6 8 6Z" />
                </svg>
            </button>
        </div>
    </nav>

    <main class="dashboard-container">
        <section class="profile-section glass">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="section-icon" style="background: rgba(124, 58, 237, 0.1); color: var(--primary); width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                        <path d="M2 2l7.586 7.586"></path>
                        <circle cx="11" cy="11" r="2"></circle>
                    </svg>
                </div>
                <h2>Request a New Book</h2>
                <p style="color: var(--text-muted);">Can't find what you're looking for? Let us know!</p>
            </div>

            <div id="alert-container" class="alert" style="display: none;"></div>

            <form id="book-request-form" class="profile-form">
                <div class="form-group">
                    <label for="title">Book Title *</label>
                    <input type="text" id="title" class="form-control" placeholder="Enter book title" required>
                    <div id="title-error" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="author">Author Name *</label>
                    <input type="text" id="author" class="form-control" placeholder="Enter author name" required>
                    <div id="author-error" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="notes">Additional Notes (Optional)</label>
                    <textarea id="notes" class="form-control" rows="4" placeholder="Any specific edition or details?"></textarea>
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Submit Request</button>
                    <a href="/dashboard.html" class="btn btn-secondary" style="display: block; text-align: center; margin-top: 1rem; text-decoration: none;">Back to Dashboard</a>
                </div>
            </form>
        </section>
        <section class="profile-section glass" style="margin-top: 3rem;">
            <div style="margin-bottom: 1.5rem;">
                <h3>My Previous Requests</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Track the status of your book requests here.</p>
            </div>
            
            <div class="admin-table-container glass" style="box-shadow: none; border-radius: 1rem;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Book Title</th>
                            <th>Author</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="my-requests-table-body">
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 2rem;">Loading your requests...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="rh-toast" id="toast-notification">
        <span id="toast-message"></span>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/book-request.js"></script>
</body>
</html>
