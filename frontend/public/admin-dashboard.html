<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - READhub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .brand span { color: #ef4444; font-size: 0.8rem; text-transform: uppercase; vertical-align: super; margin-left: 0.2rem; }
    </style>
</head>
<!-- The class protected-admin triggers the auth check in auth.js -->
<body class="protected-admin">
    
    <nav class="navbar glass" style="border-bottom-color: rgba(239, 68, 68, 0.3);">
        <div class="brand">READhub<span>Admin</span></div>
        <div class="nav-links">
            <span>Logged in as: <strong id="user-name-display" style="color: #ef4444;">Admin</strong></span>
            <button id="logout-btn" class="btn" style="background: rgba(239, 68, 68, 0.2); color: white; padding: 0.5rem 1rem; font-size: 0.875rem;">Log Out</button>
        </div>
    </nav>

    <main class="dashboard-container">
        
        <div style="margin-bottom: 2rem;">
            <h2>Platform Management Panel</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">System overview and administrative controls.</p>
        </div>

        <div class="overview-cards">
            <div class="stat-card glass" style="border-top: 3px solid var(--primary);">
                <h3>Total Users</h3>
                <div class="value">0</div>
            </div>
            <div class="stat-card glass" style="border-top: 3px solid var(--success);">
                <h3>Books in Catalog</h3>
                <div class="value">0</div>
            </div>
            <div class="stat-card glass" style="border-top: 3px solid var(--error);">
                <h3>Total Orders</h3>
                <div class="value">0</div>
            </div>
        </div>

        <div class="glass" style="margin-top: 3rem; padding: 2rem; border-radius: 1rem;">
            <h3>Quick Actions</h3>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <a href="/admin-users.html" class="btn btn-primary" style="text-decoration: none;">Manage Users</a>
                <button class="btn" style="background: rgba(255,255,255,0.1); color: white;">Manage Inventory</button>
                <button class="btn" style="background: rgba(255,255,255,0.1); color: white;">View Requests</button>
            </div>
        </div>

    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
