<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - READhub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
</head>
<body>
    <div class="auth-container">
        <!-- Hamburger Menu -->
        <div class="hamburger-icon" id="hamburger-menu">
            <span></span><span></span><span></span>
        </div>
        <!-- Theme Toggle -->
        <div class="theme-toggle-host" style="position:absolute; top:2rem; right:2rem; z-index:100;"></div>
        <!-- Sidebar -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">READhub</div>
                <button class="sidebar-close" id="sidebar-close">&times;</button>
            </div>
            <nav class="sidebar-nav">
                <a href="/login.html" class="sidebar-link">User Login</a>
                <a href="/admin-login.html" class="sidebar-link">Admin Login</a>
                <a href="/register.html" class="sidebar-link" style="color: var(--primary)">Register</a>
            </nav>
        </aside>

        <div class="auth-card glass">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Join READhub to explore and rent books.</p>
            </div>
            
            <div id="global-alert" class="alert"></div>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                    <div id="name-error" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                    <div id="email-error" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" required minlength="8">
                    <div id="password-error" class="error-message"></div>
                </div>
                
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>
            
            <div class="switch-form">
                Already have an account? <a href="/login.html">Log in here</a>
            </div>
        </div>
    </div>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger-menu');
            const closeBtn = document.getElementById('sidebar-close');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            function toggleSidebar() {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }

            if(hamburger) hamburger.addEventListener('click', toggleSidebar);
            if(closeBtn) closeBtn.addEventListener('click', toggleSidebar);
            if(overlay) overlay.addEventListener('click', toggleSidebar);
        });
    </script>
</body>
</html>
