<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - READhub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg-prism: #0F0A1A;
  --surface: rgba(30, 20, 64, 0.5);
  --surface-hover: rgba(30, 20, 64, 0.8);
  --border: rgba(168, 85, 247, 0.2);
  --border-bright: rgba(168, 85, 247, 0.35);
  --text: #F3F0FA;
  --text-muted: #A99CC0;
  --text-dim: rgba(169, 156, 192, 0.3);
  --prism-1: #A855F7;
  --prism-2: #9333EA;
  --prism-3: #EC4899;
  --prism-4: #34d399;
  --prism-5: #fb923c;
  --radius: 16px;
  --radius-sm: 10px;
  --nav-bg: rgba(15, 10, 26, 0.85);
  --dash-bg-gradient: linear-gradient(135deg, #0F0A1A 0%, #1A1035 40%, #2D1B69 100%);
  --brand-gradient: linear-gradient(135deg, #c4b5fd, #7dd3fc, #f9a8d4);
  --facet-opacity: 0.028;
  --ray-opacity: 0.18;
}

[data-theme="light"] {
  --bg-prism: #FFFFFF;
  --surface: #F3F0FA;
  --surface-hover: #EDE8F7;
  --border: rgba(124, 58, 237, 0.15);
  --border-bright: rgba(124, 58, 237, 0.25);
  --text: #0F0A1A;
  --text-muted: #3D3558;
  --text-dim: #6B6080;
  --prism-1: #7C3AED;
  --prism-2: #8B5CF6;
  --prism-3: #D946EF;
  --nav-bg: rgba(243, 240, 250, 0.92);
  --dash-bg-gradient: linear-gradient(135deg, #FFFFFF 0%, #F3F0FA 40%, #EDE8F7 100%);
  --brand-gradient: linear-gradient(135deg, #7C3AED, #D946EF);
  --facet-opacity: 0.012;
  --ray-opacity: 0.06;
}

html{background:var(--bg-prism);color:var(--text)}
body{
  font-family:'Outfit',sans-serif;
  font-size:14px;font-weight:300;
  line-height:1.6;min-height:100vh;
  overflow-x:hidden;
}

/* ── AMBIENT BACKGROUND ── */
.bg-scene{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background: var(--dash-bg-gradient);
}
.facets{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.facet{position:absolute;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%)}
.facet-a{
  width:440px;height:440px;top:-120px;right:-100px;
  background:rgba(167,139,250,var(--facet-opacity));
  border:1px solid rgba(167,139,250,0.07);
  animation:spin 32s linear infinite;
}
.facet-b{
  width:320px;height:320px;bottom:-90px;left:-80px;
  background:rgba(56,189,248,calc(var(--facet-opacity) * 0.8));
  border:1px solid rgba(56,189,248,0.06);
  animation:spin 44s linear infinite reverse;
}
.facet-c{
  width:560px;height:560px;top:38%;left:28%;
  background:rgba(244,114,182,calc(var(--facet-opacity) * 0.5));
  border:1px solid rgba(244,114,182,0.04);
  animation:spin 60s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.prism-ray{
  position:fixed;width:1px;top:0;bottom:0;z-index:0;
  background:linear-gradient(to bottom,transparent 0%,rgba(167,139,250,var(--ray-opacity)) 30%,rgba(56,189,248,calc(var(--ray-opacity) * 0.6)) 60%,transparent 100%);
  filter:blur(1px);pointer-events:none;
  transition:left 1s cubic-bezier(0.25,0.46,0.45,0.94);
}
.cursor-glow{
  position:fixed;
  width:350px;height:350px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(167,139,250,0.07) 0%,transparent 70%);
  pointer-events:none;z-index:0;
  transform:translate(-50%,-50%);
  transition:left 0.12s ease-out,top 0.12s ease-out;
}

/* ── NAVBAR ── */
.navbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 62px;
  background: var(--nav-bg);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.navbar::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: var(--prism-1); opacity: 0.2; pointer-events: none;
}
.nav-left{display:flex;align-items:center;gap:1.25rem;position:relative;z-index:1}
.brand{
  font-family:'DM Serif Display',serif;font-style:italic;
  font-size:1.4rem;letter-spacing:-0.02em;text-decoration:none;
  background: var(--brand-gradient);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.nav-right{display:flex;align-items:center;gap:1rem;position:relative;z-index:1}
.nav-link{
  color:var(--text-muted);text-decoration:none;
  font-size:13px;font-weight:400;letter-spacing:0.01em;
  transition:color 0.15s;
}
.nav-link:hover{color:var(--text);}

.hamburger-container{position:relative}
.hamburger-btn{
  background:none;border:none;cursor:pointer;
  color:var(--text-muted);padding:6px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;transition:color 0.15s,background 0.15s;
}
.hamburger-btn:hover{color:var(--text);background:var(--surface-hover)}
.hamburger-menu{
  display:none;position:absolute;top:calc(100% + 10px);left:0;
  background:rgba(12,8,28,0.95);
  backdrop-filter:blur(20px);
  border:1px solid var(--border-bright);
  border-radius:var(--radius);padding:6px;
  min-width:200px;
  box-shadow:0 24px 60px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.05);
}
.hamburger-menu.show{display:block}
.dropdown-item{
  display:block;padding:8px 12px;
  color:var(--text-muted);text-decoration:none;
  font-size:13px;border-radius:8px;
  transition:color 0.15s,background 0.15s;
}
.dropdown-item:hover{color:var(--text);background:var(--surface-hover)}

.logoutButton {
  --background: var(--prism-1);
  --background-hover: var(--prism-2);
  --color: #ffffff;
  --icon-color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.6rem 1.4rem;
  cursor: pointer;
  border: none;
  background: var(--background);
  color: var(--color);
  border-radius: 20px;
  position: relative;
  overflow: hidden;
  font-weight: 500;
  font-size: 12px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  outline: none;
  min-width: 130px;
}
.logoutButton:hover {
  background: var(--background-hover);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
}
.logoutButton .button-text {
  z-index: 10;
  position: relative;
  margin-right: 2.2rem;
  transition: transform 0.3s ease, opacity 0.2s;
}
.logoutButton:hover .button-text { transform: translateX(-3px); }
.logoutButton.logging-out .button-text { opacity: 0.5; transform: translateX(-5px); }
.logoutButton svg {
  display: block;
  position: absolute;
  fill: var(--icon-color);
  right: 1.1rem;
  top: 50%;
  transform: translateY(-50%);
  transition: all 0.3s ease;
}
.logoutButton .doorway { width: 18px; height: 22px; opacity: 0.9; z-index: 1; }
.logoutButton .door {
  width: 14px; height: 18px; right: 1.2rem;
  transform-origin: 0% 50%;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 5;
}
.logoutButton:hover .door { transform: translateY(-50%) rotateY(-35deg); }
.logoutButton.logging-out .door { transform: translateY(-50%) rotateY(0deg); transition-delay: 0.5s; }
.logoutButton .figure { width: 10px; height: 14px; right: 2.4rem; z-index: 4; opacity: 1; transition: opacity 0.2s; }
.logoutButton.logging-out .figure { animation: walkThrough 0.6s ease-in-out forwards; }
@keyframes walkThrough {
  0%   { transform: translateY(-50%) translateX(0); }
  30%  { transform: translateY(-55%) translateX(10px); }
  60%  { transform: translateY(-50%) translateX(20px); }
  100% { transform: translateY(-50%) translateX(32px); opacity: 0; }
}

/* ── MAIN ── */
main {
  position: relative; z-index: 1;
  max-width: 1100px; margin: 0 auto;
  padding: 3rem 2rem 5rem;
}

/* ── HEADER ── */
.dash-header { margin-bottom: 2.5rem; }
.dash-header h1 {
  font-family:'DM Serif Display',serif;
  font-size: clamp(2rem, 4vw, 2.8rem);
  font-weight: 400; letter-spacing: -0.03em;
  line-height: 1.2; margin-bottom: 0.5rem;
  font-style:italic;
  background:linear-gradient(135deg,#e8e4f8 20%,#c4b5fd 55%,#7dd3fc 90%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.dash-header p { color: var(--text-muted); font-size: 15px; }

.prism-divider {
  height: 1px; margin: 2rem 0;
  background: linear-gradient(90deg, transparent, var(--prism-1), var(--prism-2), transparent);
  opacity: 0.3;
}

/* ── CARDS ── */
.gem-card {
  position: relative; overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--c-accent-border, var(--border));
  border-radius: var(--radius);
  padding: 1.5rem 1.75rem;
  transition: box-shadow 0.2s, border-color 0.2s, transform 0.3s;
  margin-bottom: 1.5rem;
}
.gem-card:hover {
  border-color: var(--border-bright);
  box-shadow: 0 16px 48px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.05);
}
.gem-shimmer {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(105deg, transparent 25%, rgba(255,255,255,0.06) 50%, transparent 75%);
  transition: opacity 0.3s;
}
.facet-corner {
  position: absolute; top: 0; right: 0;
  width: 40px; height: 40px;
  background: var(--c-accent, var(--prism-1));
  clip-path: polygon(100% 0, 100% 100%, 0 0);
  opacity: 0.15;
}

/* ── BUTTONS ── */
.btn-primary {
  display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center;
  padding: 0.65rem 1.5rem; border: none; border-radius: 20px; cursor: pointer;
  background: linear-gradient(135deg, var(--prism-1), var(--prism-2));
  color: #fff; font-size: 13px; font-weight: 500; letter-spacing: 0.02em;
  text-decoration: none; transition: opacity 0.15s, transform 0.15s;
}
.btn-primary:hover { opacity: 0.88; transform: translateY(-2px); }

/* ── EMPTY STATE ── */
.empty-state {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3rem 2rem; text-align: center;
}
.empty-icon {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(168,85,247,0.12);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.25rem;
}
.empty-icon svg { width: 26px; height: 26px; color: var(--prism-1); }
.empty-state h4 { font-size: 16px; font-weight: 600; margin-bottom: 0.5rem; }
.empty-state p  { color: var(--text-muted); font-size: 13px; margin-bottom: 1.25rem; }

@media (max-width: 720px) {
  main { padding: 2rem 1.25rem 4rem; }
}
</style>
</head>

<body class="protected-user">

<!-- Ambient layers -->
<div class="bg-scene"></div>
<div class="facets">
  <div class="facet facet-a"></div>
  <div class="facet facet-b"></div>
  <div class="facet facet-c"></div>
</div>
<div class="prism-ray" id="prism-ray" style="left:50%"></div>
<div class="cursor-glow" id="cursor-glow" style="left:-500px;top:-500px"></div>

<!-- ── NAVBAR ── -->
<nav class="navbar">
  <div class="nav-left">
    <div class="hamburger-container">
      <button class="hamburger-btn" id="hamburger-btn" onclick="this.nextElementSibling.classList.toggle('show')" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none">
          <line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="14" x2="21" y2="14"/>
        </svg>
      </button>
      <div class="hamburger-menu">
        <a href="/dashboard.html" class="dropdown-item">Dashboard</a>
        <a href="/browse.html" class="dropdown-item">Browse Books</a>
        <a href="/library.html" class="dropdown-item">My Library</a>
        <a href="/cart.html" class="dropdown-item">My Cart</a>
        <a href="/order-history.html" class="dropdown-item">Order History</a>
        <a href="/profile.html" class="dropdown-item">My Profile</a>
        <a href="/book-request.html" class="dropdown-item">Request a Book</a>
      </div>
    </div>
    <a href="/dashboard.html" class="brand">READhub</a>
  </div>
  <div class="nav-right">
    <a href="/browse.html" class="nav-link">Browse</a>
    <a href="/library.html" class="nav-link">Library</a>
    <a href="/cart.html" class="cart-nav-link" id="cart-nav-link" title="Shopping Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge-count" id="cart-badge" style="display: none;">0</span>
    </a>
    <div class="theme-toggle-host"></div>
    <button id="logout-btn" class="logoutButton" style="display: none;">
      <span class="button-text">Log Out</span>
      <svg class="doorway" viewBox="0 0 16 16"><path d="M3 14V1H13V14M13 8H15" stroke="currentColor" stroke-width="2" fill="none" /></svg>
      <svg class="door" viewBox="0 0 16 16"><path d="M3 1H13V15H3V1Z" /><circle cx="10" cy="8" r="1.2" fill="#fff" /></svg>
      <svg class="figure" viewBox="0 0 16 16"><circle cx="8" cy="3" r="2.5" /><path d="M8 6C5 6 4 8 4 11V15H12V11C12 8 11 6 8 6Z" /></svg>
    </button>
  </div>
</nav>

<!-- ── MAIN ── -->
<main>
    <div class="dash-header" style="text-align: center; margin-bottom: 3rem;">
        <div style="background:var(--c-accent-bg, rgba(167,139,250,0.1)); border:1px solid var(--c-accent-border, rgba(167,139,250,0.2)); color:var(--prism-1); width:64px; height:64px; border-radius:16px; display:flex; align-items:center; justify-content:center; margin:0 auto 1.5rem;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        </div>
        <h1>Order <span style="background:linear-gradient(135deg,var(--prism-1),var(--prism-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">History</span></h1>
        <p>Track and review your past purchases</p>
    </div>

    <div class="prism-divider"></div>

    <div id="orders-loading" style="text-align: center; padding: 3rem; color: var(--text-muted);">
        Loading your orders...
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="orders-empty" style="display: none;" data-tilt>
        <div class="empty-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        </div>
        <h4>No orders yet</h4>
        <p>Your purchase history will appear here once you place an order.</p>
        <a href="/browse.html" class="btn-primary" style="margin-top: 1rem; width: auto;">Start Shopping</a>
    </div>

    <!-- Orders List Container -->
    <!-- The JavaScript should inject gem-cards inside here if we wrap them properly, but since JS writes its own HTML for the orders, we'll let it render inside this div and the JS handles inner styling, or the JS should output .gem-card structure. Since JS is pre-written to output standard classes, we'll ensure the surrounding container sets a context, or if the JS renders plain boxes, we'll accept them for now. -->
    <div id="orders-list"></div>
</main>

<!-- Toast Notification -->
<div class="rh-toast" id="toast-notification" style="display:none; position:fixed; bottom:20px; right:20px; background:var(--surface); border:1px solid var(--border); padding:1rem; border-radius:var(--radius-sm); z-index:300;">
    <span id="toast-message" style="color:var(--text);"></span>
</div>

<script src="/js/auth.js"></script>
<script src="/js/order-history.js"></script>

<script>
// ── CURSOR TRACKING ──
const glow = document.getElementById('cursor-glow');
const ray  = document.getElementById('prism-ray');
document.addEventListener('mousemove', e => {
  if (glow) { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; }
  if (ray)  { ray.style.left  = e.clientX + 'px'; }
});

// ── CLOSE HAMBURGER ON OUTSIDE CLICK ──
document.addEventListener('click', e => {
  if (!e.target.closest('.hamburger-container'))
    document.querySelectorAll('.hamburger-menu').forEach(m => m.classList.remove('show'));
});

// We need a MutationObserver to apply tilt to dynamically added orders if they use gem-card style
const observer = new MutationObserver((mutations) => {
    mutations.forEach((mutation) => {
        if (mutation.addedNodes.length) {
            document.querySelectorAll('#orders-list .rh-order-card').forEach(card => {
                // If JS renders a standard rh-order-card, we can manually add gem styles to it
                if(!card.classList.contains('gem-card')) {
                    card.classList.add('gem-card');
                    card.setAttribute('data-tilt', 'true');
                    card.style.setProperty('--c-accent', '#38bdf8');
                    card.style.setProperty('--c-accent-bg', 'rgba(56,189,248,0.1)');
                    card.style.setProperty('--c-accent-border', 'rgba(56,189,248,0.2)');
                    
                    if(!card.querySelector('.gem-shimmer')) {
                        const shimmer = document.createElement('div');
                        shimmer.className = 'gem-shimmer';
                        card.insertBefore(shimmer, card.firstChild);
                    }
                    if(!card.querySelector('.facet-corner')) {
                        const corner = document.createElement('div');
                        corner.className = 'facet-corner';
                        corner.style.background = '#38bdf8';
                        card.insertBefore(corner, card.firstChild);
                    }

                    // Add tilt logic
                    card.addEventListener('mousemove', e => {
                        const r  = card.getBoundingClientRect();
                        const dx = (e.clientX - (r.left + r.width  / 2)) / (r.width  / 2);
                        const dy = (e.clientY - (r.top  + r.height / 2)) / (r.height / 2);
                        card.style.transform = `perspective(700px) rotateX(${dy * 6}deg) rotateY(${-dx * 6}deg) scale3d(1.01,1.01,1.01)`;
                        card.style.transition = 'transform 0.08s ease';
                        const sh = card.querySelector('.gem-shimmer');
                        if (sh) { sh.style.opacity = '1'; }
                    });
                    card.addEventListener('mouseleave', () => {
                        card.style.transform  = 'perspective(700px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
                        card.style.transition = 'transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94)';
                        const sh = card.querySelector('.gem-shimmer');
                        if (sh) sh.style.opacity = '0';
                    });
                }
            });
        }
    });
});

const ordersList = document.getElementById('orders-list');
if(ordersList) {
    observer.observe(ordersList, { childList: true, subtree: true });
}
</script>
