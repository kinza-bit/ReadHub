<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library - READhub</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="light-theme">
    <!-- Navbar -->
    <nav class="navbar glass">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div class="hamburger-container">
                <button class="hamburger-btn" onclick="this.nextElementSibling.classList.toggle('show')">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="hamburger-menu glass">
                    <a href="/dashboard.html" class="dropdown-item">Dashboard</a>
                    <a href="/browse.html" class="dropdown-item">Browse Books</a>
                    <a href="/library.html" class="dropdown-item">My Library</a>
                    <a href="/cart.html" class="dropdown-item">My Cart</a>
                    <a href="/order-history.html" class="dropdown-item">Order History</a>
                    <a href="/profile.html" class="dropdown-item">My Profile</a>
                    <a href="/book-request.html" class="dropdown-item">Request a Book</a>
                </div>
            </div>
            <a href="/dashboard.html" class="brand" style="text-decoration: none;">READhub</a>
        </div>
        <div class="nav-links">
            <a href="/library.html" class="nav-link" style="color:var(--color-primary); font-weight:600;">Library</a>
            <a href="/cart.html" class="cart-nav-link">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            </a>
            <div class="theme-toggle-host"></div>
            <button id="logout-btn" class="logoutButton">
                <span class="button-text">Log Out</span>
                <svg class="doorway" viewBox="0 0 16 16"><path d="M3 14V1H13V14M13 8H15" stroke="currentColor" stroke-width="2" fill="none" /></svg>
                <svg class="door" viewBox="0 0 16 16"><path d="M3 1H13V15H3V1Z" /><circle cx="10" cy="8" r="1.2" fill="#fff" /></svg>
                <svg class="figure" viewBox="0 0 16 16"><circle cx="8" cy="3" r="2.5" /><path d="M8 6C5 6 4 8 4 11V15H12V11C12 8 11 6 8 6Z" /></svg>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container" style="padding-top: 6rem; padding-bottom: 4rem;">
        <div class="rh-page-header">
            <h1>My Library</h1>
            <p class="rh-page-subtitle">Access your purchased and rented ebooks.</p>
        </div>

        <div id="library-loading" style="text-align: center; padding: 3rem; color: var(--color-text-muted);">
            <div class="spinner"></div> Loading your library...
        </div>
        
        <div id="library-empty" class="rh-empty-cart" style="display: none;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <h3>Your library is empty</h3>
            <p>Browse the store to purchase or rent ebooks.</p>
            <a href="/browse.html" class="btn btn-primary" style="margin-top: 1rem;">Browse Books</a>
        </div>

        <div id="library-grid" class="rh-book-grid" style="display: none;">
            <!-- Library items will be injected here -->
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast-notification" class="rh-toast">
        <span id="toast-message"></span>
    </div>

    <!-- Scripts -->
    <script src="/js/theme.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/library.js"></script>
</body>
</html>
