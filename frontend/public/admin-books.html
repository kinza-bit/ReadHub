<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Books - READhub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
</head>

<body>
    <nav class="navbar glass">
        <div class="brand">READhub ADMIN</div>
        <div class="nav-links">
            <span id="admin-name" style="color: var(--color-text-muted);">Admin</span>
            <a href="/admin-dashboard.html" class="btn btn-sm btn-secondary">Dashboard</a>
            <a href="/admin-users.html" class="btn btn-sm btn-secondary">Users</a>
            <a href="/admin-categories.html" class="btn btn-sm btn-secondary">Categories</a>
            <a href="/" class="btn btn-sm btn-secondary">View Store</a>
            <div class="theme-toggle-host"></div>
            <button id="logout-btn" class="logoutButton">
                <span class="button-text">Log Out</span>
            </button>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="auth-header" style="text-align: left; margin-bottom: 2rem;">
            <h2>Book Catalog Management</h2>
            <p>Add new books, update stock levels, and manage pricing.</p>
        </div>

        <div id="alert-container" class="alert"></div>

        <div class="admin-controls" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <div style="display: flex; gap: 1rem; flex: 1;">
                <input type="text" id="book-search" class="form-control" placeholder="Search by title, author, or ISBN..." style="max-width: 400px;">
            </div>
            <button class="btn btn-primary" id="btn-add-book">Add New Book</button>
        </div>

        <div class="admin-table-container glass">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cover</th>
                        <th>Title & Author</th>
                        <th>Category</th>
                        <th>Physical Price</th>
                        <th>eBook Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="book-table-body">
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 3rem;">Loading books...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add / Edit Book Modal -->
    <div id="book-modal" class="modal">
        <div class="modal-content glass" style="max-width: 800px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h3 id="book-modal-title">Add New Book</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="book-form">
                <input type="hidden" id="edit-book-id">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="book-title" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Author</label>
                        <input type="text" id="book-author" class="form-control" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>ISBN</label>
                        <input type="text" id="book-isbn" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="book-category" class="form-control" required>
                            <!-- Options logic loaded via JS -->
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="book-description" class="form-control" rows="3"></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Physical Price ($)</label>
                        <input type="number" step="0.01" id="book-physical-price" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>eBook Price ($)</label>
                        <input type="number" step="0.01" id="book-ebook-price" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Stock Level</label>
                        <input type="number" id="book-stock" class="form-control" value="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>Cover Image URL</label>
                    <input type="text" id="book-image-url" class="form-control" placeholder="https://example.com/cover.jpg">
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Save Book</button>
                    <button type="button" class="btn btn-secondary close-modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Restock Modal -->
    <div id="restock-modal" class="modal">
        <div class="modal-content glass" style="max-width: 400px;">
            <div class="modal-header">
                <h3>Update Stock</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="restock-form">
                <input type="hidden" id="restock-book-id">
                <p style="margin-bottom: 1rem;">Adding stock for: <strong id="restock-book-title"></strong></p>
                <div class="form-group">
                    <label>Quantity to Add</label>
                    <input type="number" id="restock-quantity" class="form-control" min="1" required>
                </div>
                <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Add Stock</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/admin-books.js"></script>
</body>
</html>
