<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>READhub - Premium Bookstore</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
</head>

<body>
    <!-- Theme Toggle fixed -->
    <div class="theme-toggle-host" style="position:fixed; top:1.5rem; right:1.5rem; z-index:200;"></div>
    <div class="auth-container">
        <div class="auth-card glass">
            <div class="auth-header">
                <h2>Welcome to READhub</h2>
                <p>Discover, read, and explore.</p>
            </div>

            <a href="/login.html" class="btn btn-primary"
                style="margin-bottom: 1rem; display: block; text-align: center;">Log In</a>
            <a href="/register.html" class="btn"
                style="background: rgba(255,255,255,0.1); display: block; text-align: center; color: white;">Create
                Account</a>

            <div class="switch-form" style="margin-top: 2rem;">
                <a href="/admin-login.html" style="color: var(--text-muted); text-decoration: underline;">Admin
                    Access</a>
            </div>
        </div>
    </div>
</body>

</html>
